# Local development database: `docker compose -f compose.dev.yaml up -d`
services:
  postgres:
    image: postgres:17-alpine
    container_name: yohaneowo-site-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: site
      POSTGRES_PASSWORD: site
      POSTGRES_DB: site
    ports:
      - 127.0.0.1:15432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
