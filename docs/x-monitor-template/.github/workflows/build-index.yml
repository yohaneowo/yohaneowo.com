# Rebuild index.jsonl whenever a posts.jsonl changes, so the bot only has to append posts.
# Commits made with GITHUB_TOKEN don't trigger workflows, so this doesn't loop.
name: build index

on:
  push:
    paths:
      - "**/posts.jsonl"
      - "scripts/build_index.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_index.py
      - name: Commit the index
        run: |
          if git diff --quiet; then
            echo "index.jsonl is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.jsonl '*/posts.jsonl'
          git commit -m "Rebuild index.jsonl"
          git push
